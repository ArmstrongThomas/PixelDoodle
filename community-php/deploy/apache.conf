# Include once from Apache's main configuration.
# Requires the existing mod_php handler, mod_rewrite, mod_setenvif, mod_remoteip.
# Cloudflare Tunnel: pixels.7db.pw -> http://127.0.0.1:8086
# Keep application source, .env and databases outside this DocumentRoot.
Listen 127.0.0.1:8086

<VirtualHost 127.0.0.1:8086>
    ServerName pixels.7db.pw

    # Trust the local cloudflared connector to supply the visitor IP.
    RemoteIPHeader CF-Connecting-IP
    RemoteIPTrustedProxy 127.0.0.1

    DocumentRoot "F:/pixeldoodle"

    # Original visitor scheme supplied by the trusted local connector.
    SetEnvIfNoCase X-Forwarded-Proto "^https$" HTTPS=on

    <Directory "F:/pixeldoodle">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        <FilesMatch "(?i)\.php$">
            SetHandler application/x-httpd-php
        </FilesMatch>
    </Directory>

    DirectoryIndex index.php index.html

    ErrorLog "logs/pixeldoodle-error.log"
    # Exclude query strings so OAuth callback codes do not enter access logs.
    LogFormat "%a peer=%{c}a %l %u %t \"%m %U %H\" %>s %b" pixeldoodle_tunnel
    CustomLog "logs/pixeldoodle-access.log" pixeldoodle_tunnel
</VirtualHost>
